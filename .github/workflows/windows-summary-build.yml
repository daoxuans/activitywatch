name: Windows summary client build

# Manual test builds only. Do not use release.yml's manual trigger for this:
# that workflow can create a prerelease tag and publish a draft release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      AW_EXTRAS: true
      POETRY_INSTALLER_PARALLEL: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out pinned ActivityWatch submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for the summary client
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install summary client test and packaging dependencies
        run: python -m pip install --disable-pip-version-check cryptography pyinstaller==6.11.0

      - name: Test the consent and summary client
        working-directory: share-client
        run: >-
          python -B -c "import unittest;
          suite = unittest.defaultTestLoader.discover('tests');
          result = unittest.TextTestRunner(verbosity=2).run(suite);
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)"

      - name: Build visible summary client executable
        run: |
          mkdir -p build/share-client-spec
          python -m PyInstaller --noconfirm --clean --onefile \
            --name aw-share \
            --paths share-client \
            --distpath build/share-client-dist \
            --workpath build/share-client-work \
            --specpath build/share-client-spec \
            share-client/launcher.py

      - name: Smoke-test summary client executable
        run: |
          build/share-client-dist/aw-share.exe --help
          build/share-client-dist/aw-share.exe status

      - name: Set up ActivityWatch build toolchains
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Rust on the GitHub runner
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Install Windows installer and Poetry on the runner
        run: |
          choco install innosetup --no-progress --yes
          python -m pip install --disable-pip-version-check poetry==2.2.1

      - name: Build, test and package ActivityWatch with the summary client
        run: |
          python -m venv venv
          source venv/Scripts/activate
          poetry install
          make build SKIP_WEBUI=false SKIP_SERVER_RUST=false
          make test SKIP_SERVER_RUST=false
          poetry install
          make package SKIP_SERVER_RUST=false AW_SHARE_BINARY=build/share-client-dist/aw-share.exe

      - name: Verify bundled summary executable and Windows packages
        run: |
          test -f dist/activitywatch/aw-share.exe
          test -f dist/activitywatch/README-share-client.md
          shopt -s nullglob
          zips=(dist/activitywatch-*-windows-*.zip)
          setups=(dist/activitywatch-*-windows-*-setup.exe)
          test "${#zips[@]}" -eq 1
          test "${#setups[@]}" -eq 1
          7z l "${zips[0]}" | grep -F 'aw-share.exe'

      - name: Smoke-test an unattended installer on the disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem -Path 'dist\activitywatch-*-windows-*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw 'Expected one Windows setup executable' }
          $target = Join-Path $env:RUNNER_TEMP 'activitywatch-summary-smoke'
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /MERGETASKS=!StartMenuEntry /DIR="' + $target + '"'
          $process = Start-Process -FilePath $setups[0].FullName -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $binary = Join-Path $target 'aw-share.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw 'Installer did not include aw-share.exe' }
          & $binary status
          if ($LASTEXITCODE -ne 0) { throw 'Installed aw-share.exe status failed' }

      - name: Upload unsigned Windows test packages
        uses: actions/upload-artifact@v7
        with:
          name: activitywatch-summary-windows-qt-${{ github.run_number }}
          path: |
            dist/activitywatch-*-windows-*.zip
            dist/activitywatch-*-windows-*-setup.exe
          if-no-files-found: error
          retention-days: 14
